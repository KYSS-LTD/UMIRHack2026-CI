<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабинет сотрудника — Онлайн-деканат</title>
  <link rel="icon" href="/static/pages/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/pages/pages.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <header class="top">
    <div class="island">
      <a class="brand" href="/" aria-label="Онлайн-деканат — на стол декана">
        <img src="/static/pages/logo.svg" alt="" width="40" height="40">
        <span class="brand-text"><strong>Онлайн-деканат</strong><small>кабинет сотрудника</small></span>
      </a>
      <nav class="mode-switch" aria-label="Стол или кабинет сотрудника">
        <a href="/">Стол декана</a>
        <a href="/admin" aria-current="page">Сотрудникам</a>
      </nav>
      <span id="who" class="who hidden"></span>
      <button id="btn-logout" type="button" class="small ghost hidden" aria-label="Выйти из кабинета"><span>Выйти</span></button>
      <button id="theme-btn" class="round-btn" type="button" aria-label="Сменить тему" title="Сменить тему"></button>
    </div>
  </header>

  <main>
    <div id="banner" aria-live="polite"></div>

    <section id="login" class="login hidden" aria-labelledby="login-title">
      <div class="seal"><img src="/static/pages/logo.svg" alt="" width="56" height="56"></div>
      <p class="eyebrow">Онлайн-деканат</p>
      <h1 id="login-title">Вход для сотрудников</h1>
      <form id="login-form" autocomplete="on">
        <label for="u">Логин</label>
        <input id="u" type="text" autocomplete="username" required>
        <label for="p">Пароль</label>
        <input id="p" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Войти</button>
      </form>
      <p class="login-note">Учётную запись выдаёт ответственный за сервер. Общего пароля «по умолчанию» нет.</p>
    </section>

    <div id="app" class="hidden">
      <header class="page-head">
        <div>
          <p class="eyebrow" id="today"></p>
          <h1>Кабинет сотрудника</h1>
        </div>
        <p class="page-summary" id="summary"></p>
      </header>
      <div id="ocr-alert" class="ocr-alert hidden" role="alert"></div>
      <div class="ledger-tabs" role="tablist" aria-label="Разделы кабинета" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </main>
  <script src="/static/pages/common.js"></script>
  <script src="/static/pages/admin.js"></script>
  <script src="/static/pages/admin-overview.js"></script>
  <script src="/static/pages/admin-tickets.js"></script>
  <script src="/static/pages/admin-templates.js"></script>
  <script src="/static/pages/admin-kb.js"></script>
  <script src="/static/pages/admin-types.js"></script>
  <script src="/static/pages/admin-history.js"></script>
  <script src="/static/pages/admin-account.js"></script>
  <script src="/static/pages/admin-start.js"></script>
</body>
</html>
