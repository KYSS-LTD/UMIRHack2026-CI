# Тип документа: Справка об обучении.
# Чтобы добавить новый тип, достаточно скопировать этот файл и описать поля — код менять не нужно.
#
# Макросы в регулярных выражениях: {DATE} {FIO} {NUM}
# В patterns значение берётся из именованной группы (?P<value>...);
# у составных полей (parts) — из групп с именами частей (например, (?P<number>...) и (?P<date>...)).
id: study_certificate
title: Справка об обучении
short_title: Справка
genitive: справки об обучении
aliases:
  - справка об обучении
  - справка с места учёбы
  - справка с места учебы
  - справка обучающегося
classify:
  keywords:
    - {phrase: справка об обучении, weight: 6}
    - {phrase: справка, weight: 1}
    - {phrase: является студентом, weight: 3}
    - {phrase: действительно обучается, weight: 3}
    - {phrase: направление подготовки, weight: 3}
    - {phrase: форма обучения, weight: 3}
    - {phrase: период обучения, weight: 3}
    - {phrase: по месту требования, weight: 2}
  negative:
    - {phrase: академический отпуск, weight: 5}
    - {phrase: прошу предоставить, weight: 5}
    - {phrase: практика, weight: 4}
    - {phrase: руководитель практики, weight: 4}
fields:
  - id: student_name
    title: ФИО студента
    kind: person
    mention: [ФИО студента, ФИО, Ф.И.О., Фамилия имя отчество]
    labels: [ФИО студента, ФИО обучающегося, ФИО, Ф.И.О., Фамилия имя отчество, Студент, Студентка, Обучающийся, Обучающаяся]
    patterns:
      - '(?i:(?:подтверждает|подтверждается|удостоверяет|настоящим)[^.]{0,40}?(?:что|,)\s+(?:студент(?:ка)?|обучающ(?:ийся|аяся)|гражданин(?:ка)?)?)\s*(?P<value>{FIO})'
      - '(?i:(?:студент(?:ка)?|обучающ(?:ийся|аяся)))\s+(?P<value>{FIO})'
      - '(?i:выдана\s+(?:студент\w*\s+)?)(?P<value>{FIO})'
    missing_phrase: ФИО студента
  - id: university
    title: Название вуза
    kind: org
    multiline: true
    mention: [название вуза, наименование вуза, наименование образовательной организации, название образовательной организации]
    labels: [Название вуза, Наименование вуза, Вуз, Образовательная организация, Наименование образовательной организации, Учебное заведение]
    patterns:
      - '(?i:обучается\s+в|обучается\s+во|является\s+студентом)\s+(?P<value>[^,.;]{8,120}?)(?=\s*(?:,|;|\.|\s+по\s+(?:направлению|специальности)|\s+на\s+(?:очной|заочной|очно)|$))'
    fallback: header_org
    missing_phrase: названия вуза
  - id: direction
    title: Направление подготовки
    kind: text
    multiline: true
    labels: [Направление подготовки, Направление (специальность), Направление, Специальность, Образовательная программа, Программа обучения]
    patterns:
      - '(?i:по\s+(?:направлению(?:\s+подготовки)?|специальности))\s+(?P<value>[^,;]{4,120}?)(?=\s*(?:,|;|\.\s|\.$|\s+на\s+(?:очной|заочной|очно)|\s+форм|$))'
    missing_phrase: направления подготовки
  - id: study_form
    title: Форма обучения
    kind: choice
    choices:
      очно-заочная: [очно-заочная, очно-заочной, очно-заочное, вечерняя]
      очная: [очная, очной, очное, дневная]
      заочная: [заочная, заочной, заочное]
    labels: [Форма обучения, Форма]
    patterns:
      - '(?i:(?P<value>очно-заочн\w*|очн\w*|заочн\w*)\s+форм\w*)'
      - '(?i:форм\w*\s+обучения\s*[:\-–—]?\s*(?P<value>очно-заочн\w*|очн\w*|заочн\w*))'
    missing_phrase: формы обучения
  - id: study_period
    title: Период обучения
    kind: period
    start_labels: [Начало периода обучения, Начало обучения, Дата начала обучения, Обучается с]
    end_labels: [Окончание периода обучения, Окончание обучения, Дата окончания обучения, Обучается по]
    labels: [Период обучения, Срок обучения, Период, Обучается с, Обучение с]
    patterns:
      - '(?i:(?:обучается|обучался|обучалась|период\s+обучения)\s*[:\-–—]?\s*)(?P<value>(?:с\s+)?{DATE}\s*(?:г\.?|года)?\s*(?:по|до|[-–—])\s*{DATE}(?:\s*(?:г\.?|года))?)'
      - '(?P<value>с\s+{DATE}\s*(?:г\.?|года)?\s*по\s+{DATE}(?:\s*(?:г\.?|года))?)'
      - '(?P<value>(?:19|20)\d\d\s*[-–—]\s*(?:19|20)\d\d\s*(?:гг?\.?|годы)?)'
    missing_phrase: периода обучения
  - id: issue
    title: Номер и дата выдачи
    kind: composite
    format: "№ {number} от {date}"
    labels: [Номер и дата выдачи, Номер и дата справки, Номер и дата, Дата и номер выдачи, Дата и номер]
    patterns:
      - '(?i:(?:№|N|No|номер)\s*\.?\s*)(?P<number>[A-Za-zА-Яа-я0-9][A-Za-zА-Яа-я0-9/\-]*)\s*(?i:от|выдан\w*)?\s*(?P<date>{DATE})'
      - '(?i:справка[^\d№]{0,30}?(?:№|N|No)\s*)(?P<number>{NUM})'
      - '(?i:справка[^\d№]{0,30}?)(?P<date>{DATE})'
    parts:
      - id: number
        title: номер выдачи
        kind: number
        labels: [Номер выдачи, Номер справки, Регистрационный номер, Рег. номер, Исходящий номер, Исх. номер, Номер, "№"]
        mention: [номер, регистрационный номер, исходящий номер]
        missing_phrase: номера выдачи
      - id: date
        title: дата выдачи
        kind: date
        labels: [Дата выдачи, Дата выдачи справки, Дата справки, Дата выдачи документа, Выдана, Дата]
        mention: [дата выдачи, дата справки, дата документа, дата и номер]
        missing_phrase: даты выдачи
    missing_phrase: номера и даты выдачи
  - id: seal_signature
    title: Подпись и печать
    export_title: Подпись и печать (есть/нет)
    kind: marks
    labels: [Подпись и печать, Подпись и печать вуза]
    parts:
      - id: signature
        title: подпись
        kind: mark
        mark: signature
        labels: [Подпись, Подпись руководителя, Подпись уполномоченного лица, Декан, Ректор, Проректор, Директор, Секретарь]
        mention: [подпись]
        missing_phrase: подписи
      - id: stamp
        title: печать вуза
        kind: mark
        mark: stamp
        labels: [Печать, Печать вуза, М.П., МП]
        mention: [печать, оттиск печати, мп]
        missing_phrase: печати вуза
    missing_phrase: подписи и печати
# Если в Положении не нашлось явного перечня требований — обязательными считаем эти поля.
required_fallback:
  - student_name
  - university
  - direction
  - study_form
  - study_period
  - issue.number
  - issue.date
  - seal_signature.signature
  - seal_signature.stamp

# Соответствие формату results.json организаторов кейса (см. dekanat/official.py и раздел README «Выгрузка results.json»)
official:
  type: study_certificate
  fields:
    - {unit: student_name, key: student_name, title: ФИО студента}
    - {unit: university, key: university, title: Название вуза}
    - {unit: direction, key: program, title: Направление подготовки}
    - {unit: study_form, key: study_form, title: Форма обучения}
    - {unit: study_period, part: start, key: study_start, title: Начало периода обучения}
    - {unit: study_period, part: end, key: study_end, title: Окончание периода обучения}
    - {unit: issue.number, key: document_number, title: Номер справки}
    - {unit: issue.date, key: issue_date, title: Дата выдачи}
    - {unit: seal_signature.signature, key: signature_present, title: Подпись сотрудника, mark: true}
    - {unit: seal_signature.stamp, key: seal_present, title: Печать вуза, mark: true}
