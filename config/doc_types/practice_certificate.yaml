# Тип документа: Справка о практике.
id: practice_certificate
title: Справка о практике
short_title: Справка
genitive: справки о практике
aliases:
  - справка о практике
  - справка о прохождении практики
  - отзыв о практике
classify:
  keywords:
    - {phrase: справка о практике, weight: 6}
    - {phrase: прохождении практики, weight: 5}
    - {phrase: практика, weight: 4}
    - {phrase: руководитель практики, weight: 4}
    - {phrase: сроки практики, weight: 4}
    - {phrase: оценка, weight: 2}
    - {phrase: справка, weight: 1}
    - {phrase: организация, weight: 1}
  negative:
    - {phrase: академический отпуск, weight: 5}
    - {phrase: прошу предоставить, weight: 5}
    - {phrase: направление подготовки, weight: 2}
    - {phrase: форма обучения, weight: 2}
fields:
  - id: student_name
    title: ФИО студента
    kind: person
    mention: [ФИО студента, ФИО, Ф.И.О., Фамилия имя отчество]
    labels: [ФИО студента, ФИО практиканта, ФИО обучающегося, ФИО, Ф.И.О., Фамилия имя отчество, Студент, Студентка, Практикант, Практикантка, Обучающийся]
    patterns:
      - '(?i:(?:подтверждает|подтверждается|удостоверяет)[^.]{0,40}?(?:что|,)\s+(?:студент(?:ка)?)?)\s*(?P<value>{FIO})'
      - '(?i:(?:студент(?:ка)?|практикант(?:ка)?|обучающ(?:ийся|аяся)))\s+(?:\d\s*курса\s+)?(?P<value>{FIO})'
    missing_phrase: ФИО студента
  - id: organization
    title: Организация
    kind: org
    multiline: true
    mention: [наименование организации, название организации, организация прохождения практики, место практики]
    labels: [Организация, Организация прохождения практики, Место практики, Место прохождения практики, Предприятие, База практики, Наименование организации, Профильная организация]
    patterns:
      - '(?i:практик\w*\s+(?:проходил\w*\s+)?(?:в|на))\s+(?P<value>[^,;]{4,120}?)(?=\s*(?:,|;|\.\s|\.$|\s+с\s+\d|\s+в\s+период|\s+в\s+срок|$))'
      - '(?i:проходил\w*\s+(?:учебную\s+|производственную\s+|преддипломную\s+)?практику\s+(?:в|на))\s+(?P<value>[^,;]{4,120}?)(?=\s*(?:,|;|\.\s|\.$|\s+с\s+\d|\s+в\s+период|\s+в\s+срок|$))'
    missing_phrase: названия организации
  - id: period
    title: Сроки практики
    kind: period
    mention: [сроки практики, период практики, дата начала практики, дата окончания практики, начало практики, окончание практики]
    start_labels: [Дата начала практики, Начало практики, Практика с, Начало прохождения практики]
    end_labels: [Дата окончания практики, Окончание практики, Практика по, Окончание прохождения практики]
    labels: [Сроки практики, Срок практики, Сроки прохождения практики, Период практики, Период прохождения практики, Сроки, Срок, Период]
    patterns:
      - '(?P<value>с\s+{DATE}\s*(?:г\.?|года)?\s*по\s+{DATE}(?:\s*(?:г\.?|года))?)'
    missing_phrase: сроков практики
  - id: supervisor
    title: Руководитель практики
    kind: person
    mention: [ФИО руководителя практики]
    labels: [Руководитель практики, Руководитель практики от организации, Руководитель практики от предприятия, Руководитель от организации, Руководитель от предприятия, Руководитель]
    patterns:
      - '(?i:руководител\w*(?:\s+практики)?(?:\s+от\s+\w+)?)\s*[:\-–—,]?\s*(?:(?i:директор|начальник|менеджер|инженер|зав\.?)\s+)?(?P<value>{FIO})'
    missing_phrase: ФИО руководителя практики
  - id: grade
    title: Оценка
    kind: grade
    labels: [Оценка, Оценка за практику, Итоговая оценка, Результат, Результат практики, Аттестация]
    patterns:
      - '(?i:оценк\w*(?:\s+за\s+практику)?|с\s+оценкой|результат\w*)\s*[:\-–—]?\s*(?P<value>отлично|хорошо|удовлетворительно|зачтено|неудовлетворительно|[2-5](?:\s*\((?:отлично|хорошо|удовлетворительно|неудовлетворительно)\))?)'
    missing_phrase: оценки
  - id: issue
    title: Номер и дата выдачи
    kind: composite
    format: "№ {number} от {date}"
    labels: [Номер и дата выдачи, Номер и дата справки, Номер и дата, Дата и номер выдачи, Дата и номер]
    patterns:
      - '(?i:(?:№|N|No|номер)\s*\.?\s*)(?P<number>[A-Za-zА-Яа-я0-9][A-Za-zА-Яа-я0-9/\-]*)\s*(?i:от|выдан\w*)?\s*(?P<date>{DATE})'
      - '(?i:справка[^\d№]{0,30}?(?:№|N|No)\s*)(?P<number>{NUM})'
      - '(?i:справка[^\d№]{0,30}?)(?P<date>{DATE})'
    parts:
      - id: number
        title: номер выдачи
        kind: number
        labels: [Номер выдачи, Номер справки, Регистрационный номер, Рег. номер, Исходящий номер, Исх. номер, Номер, "№"]
        mention: [номер, регистрационный номер, исходящий номер]
        missing_phrase: номера выдачи
      - id: date
        title: дата выдачи
        kind: date
        labels: [Дата выдачи, Дата выдачи справки, Дата справки, Дата выдачи документа, Выдана, Дата]
        mention: [дата выдачи, дата справки, дата документа, дата и номер]
        missing_phrase: даты выдачи
    missing_phrase: номера и даты выдачи
  - id: seal_signature
    title: Подпись и печать
    export_title: Подпись и печать (есть/нет)
    kind: marks
    labels: [Подпись и печать, Подпись и печать организации]
    parts:
      - id: signature
        title: подпись
        kind: mark
        mark: signature
        labels: [Подпись, Подпись руководителя, Подпись руководителя практики, Руководитель, Директор]
        mention: [подпись]
        missing_phrase: подписи
      - id: stamp
        title: печать организации
        kind: mark
        mark: stamp
        labels: [Печать, Печать организации, М.П., МП]
        mention: [печать, оттиск печати, мп]
        missing_phrase: печати организации
    missing_phrase: подписи и печати
required_fallback:
  - student_name
  - organization
  - period
  - supervisor
  - grade
  - issue.number
  - issue.date
  - seal_signature.signature
  - seal_signature.stamp

# Соответствие формату results.json организаторов кейса (см. dekanat/official.py и раздел README «Выгрузка results.json»)
official:
  type: internship_certificate
  fields:
    - {unit: student_name, key: student_name, title: ФИО студента}
    - {unit: organization, key: organization, title: Название организации}
    - {unit: period, part: start, key: internship_start, title: Дата начала практики}
    - {unit: period, part: end, key: internship_end, title: Дата окончания практики}
    - {unit: supervisor, key: supervisor_name, title: ФИО руководителя практики}
    - {unit: grade, key: grade, title: Оценка}
    - {unit: issue.number, key: document_number, title: Номер справки}
    - {unit: issue.date, key: issue_date, title: Дата выдачи}
    - {unit: seal_signature.signature, key: signature_present, title: Подпись руководителя, mark: true}
    - {unit: seal_signature.stamp, key: seal_present, title: Печать организации, mark: true}
