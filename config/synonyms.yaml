# Синонимы для сопоставления слов вопроса с названиями полей документа («С какой даты НАЧИНАЕТСЯ отпуск» ~ «Дата НАЧАЛА отпуска»).
# Группа узкая: общие синонимы выше здесь вредны («сколько дней» не должно совпадать с «Период обучения»).
field_groups:
  - [начало, начала, начинается, начинаться, начнется, начнётся, начать, начинать]
  - [окончание, окончания, заканчивается, закончится, заканчиваться, конец, оканчивается, истекает, окончит]
  - [фио, фамилия, имя, отчество]
  - [вуз, университет, институт, академия]
  - [организация, предприятие, компания, фирма]

# Синонимы для вопросов по тексту произвольных документов (счета, акты, договоры): «сумма» ~ «итого», «когда» ~ «срок» и т. п.
doc_groups:
  - [сумма, итого, всего, стоимость, цена, оплата, платёж, платеж, оплатить, оплаты, начислено]
  - [номер, ном, нумерация]
  - [дата, число, числа, срок, когда, период]
  - [покупатель, заказчик, клиент, плательщик, получатель]
  - [поставщик, продавец, исполнитель, подрядчик, отправитель]
  - [инн, налогоплательщик, идентификационный]
  - [адрес, находится, расположен, местонахождение]
  - [телефон, тел, контакт, связаться]
  - [подпись, подписано, подписал, подписант, директор, руководитель]
  - [назначение, цель, основание, за что, причина]
