# Настройки сервиса. Любой параметр можно переопределить переменной окружения
# вида DEKANAT_<РАЗДЕЛ>_<КЛЮЧ>, например: DEKANAT_OCR_TESSERACT_CMD, DEKANAT_LLM_MODEL=qwen2.5:3b-instruct.

# ГЛАВНЫЙ ПЕРЕКЛЮЧАТЕЛЬ языковой модели. false (по умолчанию) — ни один компонент не обращается к модели,
# модель не загружается, всё работает на правилах Python. Переопределяется переменной окружения USE_LOCAL_LLM=true.
USE_LOCAL_LLM: false

ocr:
  engine: tesseract            # tesseract (по умолчанию)
  languages: rus+eng
  tesseract_cmd: null          # путь к tesseract; если пусто — ищем в PATH и типовых папках
  tessdata_dir: null           # папка с *.traineddata (например, tessdata_best для лучшей точности)
  max_pages: 5                 # сколько страниц PDF читать
  fast: false                  # true — один проход OCR без перебора вариантов предобработки
  good_score: 70               # качество OCR, при котором перебор вариантов останавливается
  cache_size: 4                # сколько последних документов держать в памяти процесса для повторных вопросов (0 — не кешировать)
doc_types_dir: config/doc_types
synonyms_file: config/synonyms.yaml
regulation:
  path: data/regulations/polozhenie.md
marks:
  enabled: true                # искать подпись и печать на изображении
qa:
  min_coverage: 0.55           # доля «веса» слов вопроса, найденных в пункте Положения, ниже которой отвечаем «нет данных»
  max_related: 2
llm:                           # параметры локальной модели; действуют только при USE_LOCAL_LLM: true
  backend: ollama              # единственный backend: Ollama (локально, на CPU). Внешние API не используются
  ollama_url: http://localhost:11434
  model: qwen2.5:3b-instruct   # Qwen2.5-3B-Instruct (ollama pull qwen2.5:3b-instruct)
  timeout: 120                 # секунд на один запрос к модели
  threads: 0                   # потоки CPU для инференса; 0 — решает Ollama
  cpu_only: true               # num_gpu=0: модель считается только на CPU
  num_ctx: 4096                # максимальный контекст (токены)
  max_input_chars: 6000        # длиннее входной текст обрезается
  max_output_tokens: 400       # потолок длины ответа модели
  max_retries: 1               # повторов при невалидном JSON (всего попыток 1 + max_retries)
  keep_alive: 5m               # сколько держать модель в памяти после последнего запроса
  cooldown_seconds: 60         # пауза после подряд идущих ошибок связи, чтобы не долбить недоступную модель
server:
  host: 127.0.0.1
  port: 8000
  allow_edit: true             # разрешить редактировать типы документов и Положение из веб-интерфейса (ещё нужен вход администратора)
  max_upload_mb: 25
  cookie_secure: auto          # auto | true | false — флаг Secure у cookie (auto: только при https)
  max_new_sessions_per_minute: 60   # сколько новых пользовательских сессий можно открыть с одного адреса за минуту (0 — без ограничения)
storage:
  db_path: data/storage/dekanat.db     # SQLite: сессии, обращения, статистика, история изменений
  templates_dir: templates             # внутренний каталог /templates/ для DOCX-шаблонов (с версиями)
  output_dir: data/output              # готовые документы пользователей (удаляются по сроку хранения)
privacy:
  session_ttl_hours: 24        # сессия без активности удаляется вместе с анкетой и данными
  generated_ttl_hours: 24      # срок хранения готовых документов
  passport_ttl_minutes: 60     # паспортные данные из анкеты удаляются через столько минут после ввода
  ticket_retention_days: 180   # срок хранения обращений в деканат
  event_retention_days: 365    # срок хранения обезличенных событий статистики
admin:
  protect_edit: true           # правки Положения и типов документов только после входа администратора (false — как раньше, только для локального запуска!)
  session_hours: 8
  min_password_length: 10
  max_login_failures: 5        # подряд неудачных входов до блокировки
  lockout_minutes: 15
delivery:
  channel: queue               # queue — внутренняя очередь обращений (их видит администратор); none — отправка недоступна

mail:
  enabled: false               # true — слать студенту письмо с номером и кодом статуса, если он указал почту (пароль — только в переменной окружения DEKANAT_MAIL_PASSWORD)
  host: ""                     # SMTP-сервер, например smtp.yandex.ru
  port: 587
  security: starttls           # starttls | ssl | none
  username: ""                 # логин на почтовом сервере (часто совпадает с адресом отправителя)
  from: ""                     # адрес отправителя, например dekanat@example.ru
  public_url: ""               # адрес сайта для ссылки в письме, например https://dekanat.example.ru (пусто — письмо подскажет путь в меню)

submission:
  allow_debts: false               # false — обращение с академическими задолженностями в деканат не отправляется (документ студент скачивает)
  require_target_specialty: true   # true — без целевого направления обращение не отправляется

# Необязательные аккаунты: вход на сайте через Telegram. Без входа сайт работает по анонимной сессии, как раньше.
accounts:
  session_days: 30             # вход на сайте держится столько дней без активности
  data_days: 90                # анкета и документ вошедшего хранятся столько дней без активности (у анонимных — privacy.session_ttl_hours)
  retention_days: 365          # аккаунт без единого входа и сообщения боту за столько дней удаляется вместе с данными (0 — не удалять)

# Telegram-бот и Mini App. Выключено по умолчанию. Токен выдаёт @BotFather и задаётся ТОЛЬКО переменной окружения DEKANAT_TELEGRAM_BOT_TOKEN
# (в репозитории и в этом файле токена быть не должно). Распознавание документов и ответы остаются на сервере деканата, без внешних языковых моделей;
# но сами сообщения бота проходят через серверы Telegram — см. раздел «Telegram и требования ТЗ» в README.
telegram:
  enabled: false
  bot_token: null              # лучше не писать сюда, а задать DEKANAT_TELEGRAM_BOT_TOKEN
  bot_username: null           # имя бота без @ (если пусто, берётся из getMe при запуске)
  mode: polling                # polling — бот сам ходит в Telegram (публичный адрес не нужен); webhook — Telegram присылает сообщения на public_url
  run_in_server: true          # true — бот работает внутри процесса сайта; false — запускать отдельно: python -m dekanat bot
  public_url: null             # https-адрес сайта: нужен для кнопки Mini App и режима webhook (например https://dekanat.example.ru)
  mini_app: true               # показывать кнопку приложения внутри Telegram (при заданном https public_url)
  webhook_secret: null         # дополнительная соль секретов webhook (необязательно)
  api_url: null                # адрес Bot API (по умолчанию https://api.telegram.org); нужен только для тестов с поддельным сервером
  staff_chat_id: null          # id чата сотрудников: туда приходит «Новое обращение № …» (бот должен быть в этом чате)
  login_ttl_seconds: 300       # сколько живёт запрос входа на сайте через бота
  initdata_max_age_hours: 24   # насколько свежими должны быть данные Mini App
  rate_per_minute: 20          # сообщений в минуту от одного человека
  files_per_hour: 12           # документов в час от одного человека
  workers: 4                   # потоков обработки сообщений
