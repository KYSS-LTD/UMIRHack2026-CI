# Контрольные вопросы для проверки базы знаний: «Кабинет сотрудника» → «База знаний» → «Проверить ответы».
# Секретарь отвечает на каждый вопрос по текущему Положению и документам базы, а проверка сверяет пункт в ответе с ожидаемым.
# Нужна после замены Положения или добавления документа: сразу видно, что ответы не сломались.
#
# ref: «7.2» — ожидается ответ с этим пунктом; no_answer: true — ожидается честное «в Положении нет информации».
# Вопросы ниже написаны для учебного Положения из data/regulations. Заменили Положение — замените и этот список своими вопросами.
questions:
  - {question: "Сколько дней рассматривается заявление?", ref: "6.1"}
  - {question: "Как уведомляют о результатах рассмотрения?", ref: "6.2"}
  - {question: "Сколько дней действительна справка об обучении?", ref: "3.3"}
  - {question: "Что должна содержать справка об обучении для перевода?", ref: "3.2"}
  - {question: "Бесплатно ли выдают справку об обучении?", ref: "3.5"}
  - {question: "Принимаются ли документы на английском языке?", ref: "2.3"}
  - {question: "На какой срок предоставляется академический отпуск?", ref: "4.1"}
  - {question: "Нужна ли медицинская справка при академическом отпуске?", ref: "4.4"}
  - {question: "Может ли дата окончания отпуска быть раньше даты начала?", ref: "4.5"}
  - {question: "Кто подписывает справку о практике?", ref: "5.3"}
  - {question: "Какие документы нужны для перевода из другого вуза?", ref: "7.2"}
  - {question: "В течение скольки дней принимается решение о переводе?", ref: "7.3"}
  - {question: "Сколько стоит обучение?", no_answer: true}
  - {question: "Сколько будет стоить общежитие?", no_answer: true}
  - {question: "Какой сегодня курс доллара?", no_answer: true}
